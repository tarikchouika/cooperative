{% extends "base.html" %}
{% block title %}{{ t('new_journal_entry') }}{% endblock %}
{% block content %}
<style>
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .table-entries { margin-bottom: 15px; }
    .totals-row td { background: #F8F9FA; font-weight: 600; }
    .amount-input { text-align: center; }
    .text-center { text-align: center; }
</style>
<div class="page-header">
    <h1>{{ t('new_journal_entry') }}</h1>
</div>

<div class="card">
    <form method="POST" id="journalForm">
        <div class="form-row">
            <div class="form-group">
                <label>{{ t('entry_date') }}</label>
                <input type="date" name="entry_date" required class="form-control" value="{{ today }}">
            </div>
            <div class="form-group flex-grow">
                <label>{{ t('description') }}</label>
                <input type="text" name="description" required class="form-control">
            </div>
        </div>

        <table class="table-entries" id="entryLines">
            <thead>
                <tr>
                    <th style="width:40%">{{ t('account') }}</th>
                    <th style="width:25%">{{ t('debit') }}</th>
                    <th style="width:25%">{{ t('credit') }}</th>
                    <th style="width:10%"></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <select name="account_id" class="form-control" required>
                            <option value="">{{ t('select_account') }}</option>
                            {% for acc in accounts %}
                            <option value="{{ acc.id }}">{{ acc.account_code }} - {{ acc.account_name }}</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td><input type="number" name="debit" step="0.01" min="0" class="form-control amount-input" oninput="calculateTotals()"></td>
                    <td><input type="number" name="credit" step="0.01" min="0" class="form-control amount-input" oninput="calculateTotals()"></td>
                    <td><button type="button" class="btn btn-danger btn-sm" onclick="removeLine(this)"><i class="fas fa-trash"></i></button></td>
                </tr>
            </tbody>
            <tfoot>
                <tr class="totals-row">
                    <td><strong>{{ t('totals') }}</strong></td>
                    <td><strong id="totalDebit">0.00</strong></td>
                    <td><strong id="totalCredit">0.00</strong></td>
                    <td></td>
                </tr>
                <tr>
                    <td colspan="3"><span id="balanceStatus" class="badge"></span></td>
                    <td></td>
                </tr>
            </tfoot>
        </table>

        <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="addLine()">
                <i class="fas fa-plus"></i> {{ t('add_line') }}
            </button>
            <button type="submit" class="btn btn-primary" id="submitBtn" disabled>
                <i class="fas fa-save"></i> {{ t('save_entry') }}
            </button>
        </div>
    </form>
</div>

<script>
function addLine() {
    const tbody = document.querySelector('#entryLines tbody');
    const newRow = tbody.rows[0].cloneNode(true);
    newRow.querySelectorAll('input').forEach(i => i.value = '');
    tbody.appendChild(newRow);
}

function removeLine(btn) {
    const tbody = document.querySelector('#entryLines tbody');
    if (tbody.rows.length > 1) {
        btn.closest('tr').remove();
        calculateTotals();
    }
}

function calculateTotals() {
    let totalDebit = 0, totalCredit = 0;
    document.querySelectorAll('#entryLines tbody tr').forEach(row => {
        const d = parseFloat(row.querySelector('input[name="debit"]').value) || 0;
        const c = parseFloat(row.querySelector('input[name="credit"]').value) || 0;
        totalDebit += d;
        totalCredit += c;
    });
    document.getElementById('totalDebit').textContent = totalDebit.toFixed(2);
    document.getElementById('totalCredit').textContent = totalCredit.toFixed(2);
    const status = document.getElementById('balanceStatus');
    const submitBtn = document.getElementById('submitBtn');
    if (Math.abs(totalDebit - totalCredit) < 0.01 && totalDebit > 0) {
        status.textContent = '✓ {{ t("balanced") }}';
        status.className = 'badge badge-success';
        submitBtn.disabled = false;
    } else {
        status.textContent = '✗ {{ t("difference") }}: ' + (totalDebit - totalCredit).toFixed(2);
        status.className = 'badge badge-danger';
        submitBtn.disabled = true;
    }
}
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ t('add_document') }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="fas fa-file-contract"></i> {{ t('add_document') }}</h1>
</div>

<div class="card">
    <form method="post" action="{{ url_for('legal.new_document') }}">
        <div class="form-row">
            <div class="form-group">
                <label>{{ t('doc_type') }}</label>
                <input type="text" name="doc_type" class="form-control" required>
            </div>
            <div class="form-group">
                <label>{{ t('doc_number') }}</label>
                <input type="text" name="doc_number" class="form-control">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>{{ t('issue_date') }}</label>
                <input type="date" name="issue_date" class="form-control">
            </div>
            <div class="form-group">
                <label>{{ t('expiry_date') }}</label>
                <input type="date" name="expiry_date" class="form-control">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>{{ t('issuing_authority') }}</label>
                <input type="text" name="issuing_authority" class="form-control">
            </div>
            <div class="form-group">
                <label>{{ t('reminder_days') }}</label>
                <input type="number" name="reminder_days" class="form-control" value="30" min="0">
            </div>
        </div>
        <div class="form-group">
            <label>{{ t('notes') }}</label>
            <textarea name="notes" class="form-control" rows="3"></textarea>
        </div>
        <div style="margin-top: 15px;">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> {{ t('save') }}
            </button>
            <a href="{{ url_for('legal.index') }}" class="btn btn-secondary">{{ t('back') }}</a>
        </div>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ t('new_project') }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ t('new_project') }}</h1>
    <a href="{{ url_for('projects.index') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> {{ t('back') }}
    </a>
</div>

<div class="card">
    <form method="POST">
        <div class="form-group">
            <label>{{ t('project_name') }} *</label>
            <input type="text" name="project_name" required class="form-control" placeholder="{{ t('project_name') }}">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>{{ t('category') }}</label>
                <input type="text" name="category" class="form-control">
            </div>
            <div class="form-group">
                <label>{{ t('manager') }}</label>
                <select name="manager_id" class="form-control">
                    <option value="">{{ t('select_manager') }}</option>
                    {% for m in managers %}
                    <option value="{{ m.id }}">{{ m.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>{{ t('start_date') }}</label>
                <input type="date" name="start_date" class="form-control" value="{{ today }}">
            </div>
            <div class="form-group">
                <label>{{ t('end_date') }}</label>
                <input type="date" name="end_date" class="form-control">
            </div>
            <div class="form-group">
                <label>{{ t('budget') }}</label>
                <input type="number" name="budget" step="0.01" min="0" class="form-control" value="0">
            </div>
            <div class="form-group">
                <label>{{ t('status') }}</label>
                <select name="status" class="form-control">
                    <option value="planning">{{ t('status_planning') }}</option>
                    <option value="active" selected>{{ t('status_active') }}</option>
                    <option value="completed">{{ t('status_completed') }}</option>
                    <option value="suspended">{{ t('status_suspended') }}</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>{{ t('description') }}</label>
            <textarea name="description" class="form-control" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label>{{ t('notes') }}</label>
            <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>

        <p style="color: var(--text-light); font-size: 0.9rem;">
            <i class="fas fa-info-circle"></i> {{ t('auto_number_note') }}
        </p>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> {{ t('save_project') }}
            </button>
            <a href="{{ url_for('projects.index') }}" class="btn btn-secondary">{{ t('back') }}</a>
        </div>
    </form>
</div>
{% endblock %}
